<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mrs. Convery's Class Game</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: #fdf3d8;
    display: flex; align-items: center; justify-content: center;
    font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", sans-serif;
    overflow: hidden;
  }
  #world { position: fixed; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; z-index: -1; }
  #hero { position: fixed; width: 168px; height: 224px; image-rendering: pixelated; cursor: pointer;
          transform-origin: 50% 100%; transform: translateX(-50%); }
  #hero.boing { animation: boing .7s ease; }
  @keyframes boing {
    0% { transform: translateX(-50%) translateY(0) rotate(0); }
    25% { transform: translateX(-50%) translateY(-90px) rotate(-10deg); }
    50% { transform: translateX(-50%) translateY(0) rotate(8deg) scaleY(.85); }
    70% { transform: translateX(-50%) translateY(-25px) rotate(-5deg); }
    100% { transform: translateX(-50%) translateY(0) rotate(0); }
  }
  #mute { position: fixed; top: 14px; right: 14px; font-size: 40px; background: #fff; border: 4px solid #3a2a8a;
          border-radius: 16px; width: 72px; height: 72px; cursor: pointer; }
  #panel { position: fixed; right: 3vw; top: 20vh; width: min(58vw, 900px); background: rgba(255,255,255,.92);
           border: 6px solid #3a2a8a; border-radius: 28px; padding: 18px 20px 22px; box-sizing: border-box; text-align: center; }
  #groups { display: flex; justify-content: center; gap: 18px; min-height: 150px; flex-wrap: wrap; }
  .group { display: flex; flex-direction: column; align-items: center; background: #eef4ff; border-radius: 18px; padding: 8px 10px; }
  .pair { display: flex; }
  .pair img { width: 110px; height: 110px; margin: -22px -18px -26px; opacity: 0; transition: opacity .1s; }
  .pair img.landed { opacity: 1; }
  .count { font-size: 52px; font-weight: bold; color: #3a2a8a; opacity: 0; transition: opacity .3s; }
  .count.show { opacity: 1; }
  .count.ask { color: #e8413c; }
  #answers { display: flex; justify-content: center; gap: 22px; margin-top: 16px; }
  #answers button { min-width: 150px; height: 130px; font-size: 64px; font-weight: bold; font-family: inherit;
                    border: 6px solid #3a2a8a; border-radius: 24px; background: #ffcf33; color: #3a2a8a; cursor: pointer;
                    box-shadow: 0 8px 0 #3a2a8a; }
  #answers button:active { transform: translateY(6px); box-shadow: 0 2px 0 #3a2a8a; }
  #answers button.nope { animation: wobble .5s; background: #ddd; }
  @keyframes wobble { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-12deg); } 75% { transform: rotate(12deg); } }
  #msg { font-size: 60px; font-weight: bold; height: 72px; color: #2f9a2e; }
  .flier { position: fixed; left: 0; top: 0; width: 110px; height: 110px; pointer-events: none; z-index: 5; }
  .rain { position: fixed; top: 0; left: 0; width: 56px; height: 100px; pointer-events: none; z-index: 6; }
  #pile { position: fixed; left: 12px; bottom: 12px; width: 34vw; display: flex; flex-wrap: wrap-reverse; gap: 4px;
          align-items: flex-end; z-index: 4; }
  #pile img { width: 50px; height: 90px; animation: plop .4s ease; }
  @keyframes plop { 0% { transform: scale(0) translateY(-80px); } 70% { transform: scale(1.3); } 100% { transform: scale(1); } }
  #seq { font-size: 64px; font-weight: bold; color: #3a2a8a; min-height: 0; }
  #seq .q { color: #e8413c; }
  .group.next { opacity: .45; outline: 5px dashed #e8413c; animation: wobble 1s infinite; }
  .pair.three img { width: 96px; height: 96px; margin: -18px -16px -22px; }
  #level { position: fixed; top: 14px; left: 14px; font-size: 36px; font-weight: bold; font-family: inherit;
           background: #ffcf33; color: #3a2a8a; border: 4px solid #3a2a8a; border-radius: 16px; padding: 6px 16px; cursor: pointer; z-index: 7; }
  #levelup { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 8;
             font-size: clamp(70px, 12vw, 180px); font-weight: bold; color: #ffcf33; text-shadow: 8px 8px 0 #3a2a8a;
             background: rgba(58,42,138,.35); }
  #levelup.show { display: flex; animation: plop .6s ease; }
  #score { position: fixed; left: 14px; top: 84px; font-size: 40px; font-weight: bold; color: #fff;
           text-shadow: 3px 3px 0 #3a2a8a; z-index: 4; }
  #win { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
         z-index: 9; background: rgba(58,42,138,.82); text-align: center; }
  #win.show { display: flex; animation: plop .6s ease; }
  #win .big { font-size: clamp(70px, 11vw, 170px); font-weight: bold; color: #ffcf33; text-shadow: 8px 8px 0 #3a2a8a; }
  #win .medals { display: none; }
  #win .big { line-height: 1; }
  #win button { margin-top: 10px; }
  #win .prize { height: 52vh; max-width: 90vw; object-fit: contain; image-rendering: auto; filter: drop-shadow(0 10px 0 rgba(0,0,0,.25));
                animation: grow 1s cubic-bezier(.3,1.6,.5,1), dance 1.2s 1s ease-in-out infinite; }
  #win .prizeName { font-size: clamp(40px, 6vw, 80px); font-weight: bold; color: #fff; text-shadow: 5px 5px 0 #3a2a8a; }
  @keyframes grow { 0% { transform: scale(0) rotate(-200deg); } 100% { transform: scale(1) rotate(0); } }
  @keyframes dance { 0%,100% { transform: rotate(-6deg) translateY(0); } 50% { transform: rotate(6deg) translateY(-18px); } }
  #win .medals img { width: 70px; height: 126px; margin: 0 6px; animation: wobble 1s infinite; }
  #win button { margin-top: 24px; font-size: 56px; font-weight: bold; font-family: inherit; padding: 18px 40px;
                border: 6px solid #3a2a8a; border-radius: 24px; background: #5cbf3a; color: #fff; cursor: pointer;
                box-shadow: 0 8px 0 #3a2a8a; }
  h1 {
    font-size: clamp(40px, 5.5vw, 80px);
    color: #5b4bb7;
    text-align: center;
    margin: 0 24px;
    color: #fff;
    text-shadow: 5px 5px 0 #3a2a8a;
    align-self: flex-start; margin-top: 4vh;
  }
</style>
</head>
<body>
  <canvas id="world"></canvas>
  <h1 id="title">Mrs. Convery's Class Game</h1>
  <button id="level">Level 1</button>
  <div id="levelup">LEVEL 2! ⭐</div>
  <div id="panel">
    <div id="seq"></div>
    <div id="groups"></div>
    <div id="msg"></div>
    <div id="answers"></div>
  </div>
  <div id="pile"></div>
  <div id="score">🏅 0 of 7</div>
  <div id="win">
    <div class="big">YOU WIN! 🏆</div>
    <img class="prize" alt="">
    <div class="prizeName"></div>
    <div class="medals"></div>
    <button id="again">Play again! ▶</button>
  </div>
<script>
// ---- Blocky world: sky, square sun, block clouds, hills of grass / dirt / stone blocks ----
const world = document.getElementById('world');
const wctx = world.getContext('2d');
let seed = 7;
function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const c = [n >> 16, (n >> 8) & 255, n & 255].map(v => Math.max(0, Math.min(255, v + amt)));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
function block(x, y, s, base, topColor) {
  const p = s / 8;
  for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++) {
    let col = base;
    if (topColor && (j < 2 || (j === 2 && rnd() < 0.5))) col = topColor;
    wctx.fillStyle = shade(col, Math.floor(rnd() * 30 - 15));
    wctx.fillRect(Math.floor(x + i * p), Math.floor(y + j * p), Math.ceil(p), Math.ceil(p));
  }
}
function drawWorld() {
  seed = 7;
  const W = world.width = innerWidth, H = world.height = innerHeight;
  const s = Math.ceil(Math.max(W, H) / 22);              // block size
  const sky = wctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#6ec6ff'); sky.addColorStop(1, '#bfe9ff');
  wctx.fillStyle = sky; wctx.fillRect(0, 0, W, H);
  wctx.fillStyle = '#ffe14d'; wctx.fillRect(W - s * 4, s, s * 2, s * 2);   // square sun
  wctx.fillStyle = '#fff6a8'; wctx.fillRect(W - s * 3.6, s * 1.4, s * 1.2, s * 1.2);
  wctx.fillStyle = '#ffffff';                                               // block clouds
  [[2, 2, 4], [9, 1, 5], [15, 3, 3]].forEach(([cx, cy, w]) => {
    wctx.fillRect(cx * s, cy * s, w * s, s * 0.7);
    wctx.fillRect((cx + 1) * s, (cy - 0.6) * s, (w - 2) * s, s * 0.7);
  });
  const cols = Math.ceil(W / s) + 1, rows = Math.ceil(H / s);
  for (let c = 0; c < cols; c++) {
    const ground = Math.floor(rows * 0.68 + Math.sin(c * 0.45) * 1.6 + Math.sin(c * 0.17) * 1.2);
    for (let r = ground; r < rows; r++) {
      const x = c * s, y = r * s;
      if (r === ground) block(x, y, s, '#8b5a2b', '#5cbf3a');           // grass block
      else if (r < ground + 3) block(x, y, s, '#8b5a2b');                // dirt
      else block(x, y, s, '#8a8a8a');                                    // stone
    }
    if (c % 7 === 3) {                                                    // little block tree
      for (let t = 1; t <= 3; t++) block(c * s, (ground - t) * s, s, '#7a4f25');
      for (let a = -1; a <= 1; a++) for (let b = 4; b <= 5; b++) block((c + a) * s, (ground - b) * s, s, '#3e9a2e');
    }
  }
}
// ---- Our very own blocky superhero ----
const HERO = [
  '...kkkkkk...',
  '..kkkkkkkk..',
  '..mmmmmmmm..',
  '..mwemmewm..',
  '..ssssssss..',
  '..ssskksss..',
  '...ssssss...',
  'rrbbbbbbbbrr',
  'rbbbbyybbbbr',
  'rbbbyyyybbbr',
  'rbbbbyybbbbr',
  'rsbyyyyyybsr',
  'r.bbbbbbbb.r',
  'r.bbb..bbb.r',
  '..rrr..rrr..',
  '..rrr..rrr..',
];
const HERO_COLORS = { k: '#5a3a1a', m: '#2b4fd6', w: '#ffffff', e: '#1a1a3a', s: '#f6c79a',
                      b: '#2f6cf0', y: '#ffcf33', r: '#e8413c' };
const hero = document.createElement('canvas');
hero.id = 'hero'; hero.width = 12; hero.height = 16;
const hctx = hero.getContext('2d');
HERO.forEach((row, y) => [...row].forEach((ch, x) => {
  if (HERO_COLORS[ch]) { hctx.fillStyle = HERO_COLORS[ch]; hctx.fillRect(x, y, 1, 1); }
}));
document.body.appendChild(hero);

let groundTop = 0;
function placeHero() {
  const s = Math.ceil(Math.max(innerWidth, innerHeight) / 22), rows = Math.ceil(innerHeight / s);
  const c = Math.floor(innerWidth / s * 0.3);
  const g = Math.floor(rows * 0.68 + Math.sin(c * 0.45) * 1.6 + Math.sin(c * 0.17) * 1.2);
  hero.style.left = (c * s + s / 2) + 'px';
  hero.style.top = (g * s - 224) + 'px';
}

// ---- Sounds (Web Audio) + mute ----
let muted = false, actx;
function boingSound() {
  if (muted) return;
  actx = actx || new AudioContext();
  const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
  o.type = 'square';
  o.frequency.setValueAtTime(220, t); o.frequency.exponentialRampToValueAtTime(880, t + 0.15);
  o.frequency.exponentialRampToValueAtTime(330, t + 0.4);
  g.gain.setValueAtTime(0.15, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.45);
}
const muteBtn = document.createElement('button');
muteBtn.id = 'mute'; muteBtn.textContent = '🔊';
muteBtn.onclick = () => { muted = !muted; muteBtn.textContent = muted ? '🔇' : '🔊'; };
document.body.appendChild(muteBtn);

hero.addEventListener('pointerdown', () => {
  hero.classList.remove('boing'); void hero.offsetWidth; hero.classList.add('boing');
  boingSound();
});

// ---- More sounds ----
function tone(freqs, type, len, vol) {
  if (muted) return;
  actx = actx || new AudioContext();
  freqs.forEach((f, i) => {
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i * len;
    o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + len * 1.6);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + len * 1.6);
  });
}
const ting = () => tone([1320, 1760], 'triangle', 0.07, 0.15);
const yay = () => tone([523, 659, 784, 1047], 'square', 0.11, 0.1);
function silly() {                         // gentle slide-whistle "whoops"
  if (muted) return;
  actx = actx || new AudioContext();
  const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
  o.type = 'sine'; o.frequency.setValueAtTime(700, t); o.frequency.exponentialRampToValueAtTime(250, t + 0.5);
  g.gain.setValueAtTime(0.2, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.55);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.55);
}

// ---- The math: our superhero throws gems in pairs. Count by 2s! ----
const GEMS = ['gemBlue', 'gemGreen', 'gemRed', 'gemYellow'];
const groupsEl = document.getElementById('groups'), answersEl = document.getElementById('answers'),
      msgEl = document.getElementById('msg');
let answer = 0, busy = false;
const wait = ms => new Promise(r => setTimeout(r, ms));
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function throwGem(img) {
  const from = hero.getBoundingClientRect(), to = img.getBoundingClientRect();
  const f = document.createElement('img');
  f.src = img.src; f.className = 'flier'; document.body.appendChild(f);
  const x0 = from.left + from.width / 2 - 36, y0 = from.top + 60, x1 = to.left, y1 = to.top;
  const top = Math.min(y0, y1) - 160;
  f.animate([
    { transform: `translate(${x0}px, ${y0}px) rotate(0)` },
    { transform: `translate(${(x0 + x1) / 2}px, ${top}px) rotate(360deg)` },
    { transform: `translate(${x1}px, ${y1}px) rotate(720deg)` },
  ], { duration: 700, easing: 'ease-in-out', fill: 'forwards' });
  return wait(700).then(() => { f.remove(); img.classList.add('landed'); ting(); });
}

let level = 1, rightAnswers = 0, reveal = () => {};
const seqEl = document.getElementById('seq'), levelBtn = document.getElementById('level');
function setLevel(n) { level = n; levelBtn.textContent = 'Level ' + n; }
levelBtn.onclick = () => { if (!busy) { setLevel(level === 1 ? 2 : 1); newQuestion(); } };   // grown-up shortcut

function showChoices(choices) {
  shuffle(choices).forEach(n => {
    const b = document.createElement('button'); b.textContent = n;
    b.onclick = () => pick(b, n);
    answersEl.appendChild(b);
  });
}

function newQuestion() {
  busy = true;
  groupsEl.innerHTML = ''; answersEl.innerHTML = ''; msgEl.textContent = ''; seqEl.innerHTML = '';
  return level === 1 ? countBy2() : backBy3();
}

// Level 2: the superhero catches gems back, 3 at a time. Count backwards by 3s!
function flyToHero(img) {
  const from = img.getBoundingClientRect(), to = hero.getBoundingClientRect();
  const f = document.createElement('img');
  f.src = img.src; f.className = 'flier'; document.body.appendChild(f);
  img.style.visibility = 'hidden';
  f.animate([
    { transform: `translate(${from.left}px, ${from.top}px) rotate(0)` },
    { transform: `translate(${(from.left + to.left) / 2}px, ${Math.min(from.top, to.top) - 160}px) rotate(-360deg)` },
    { transform: `translate(${to.left + 30}px, ${to.top + 60}px) rotate(-720deg) scale(.4)` },
  ], { duration: 700, easing: 'ease-in-out', fill: 'forwards' });
  return wait(700).then(() => { f.remove(); ting(); });
}
async function catchGroup(g) {
  hero.classList.remove('boing'); void hero.offsetWidth; hero.classList.add('boing');
  const imgs = [...g.querySelectorAll('img')];
  flyToHero(imgs[0]); await wait(100); flyToHero(imgs[1]); await wait(100); await flyToHero(imgs[2]);
  g.remove();
}
async function backBy3() {
  const groups = 3 + Math.floor(Math.random() * 4);      // 3 to 6 groups: start at 9, 12, 15 or 18
  const start = groups * 3;
  answer = start - 9;
  const color = GEMS[Math.floor(Math.random() * GEMS.length)];
  for (let p = 0; p < groups; p++) {
    const g = document.createElement('div'); g.className = 'group';
    g.innerHTML = `<div class="pair three">${`<img class="landed" src="assets/${color}.png">`.repeat(3)}</div>`;
    groupsEl.appendChild(g);
  }
  seqEl.innerHTML = start; ting();
  await wait(1200);
  for (let step = 1; step <= 2; step++) {
    await catchGroup(groupsEl.lastChild);
    seqEl.innerHTML += ' → ' + (start - step * 3);
    await wait(700);
  }
  seqEl.innerHTML += ' → <span class="q">❓</span>';
  if (groupsEl.lastChild) groupsEl.lastChild.classList.add('next');
  showChoices([answer, answer + 3, answer >= 3 ? answer - 3 : answer + 1]);
  reveal = async () => {
    if (groupsEl.lastChild) { groupsEl.lastChild.classList.remove('next'); catchGroup(groupsEl.lastChild); }
    seqEl.querySelector('.q').textContent = answer;
    seqEl.querySelector('.q').classList.remove('q');
  };
  busy = false;
}

async function levelUp() {
  setLevel(2);
  const lu = document.getElementById('levelup');
  lu.classList.add('show'); play('level_up'); yay();
  await wait(2500);
  lu.classList.remove('show');
}

async function countBy2() {
  const pairs = 2 + Math.floor(Math.random() * 4);      // 2 to 5 pairs
  answer = pairs * 2;
  const color = GEMS[Math.floor(Math.random() * GEMS.length)];
  const groups = [];
  for (let p = 1; p <= pairs; p++) {
    const g = document.createElement('div'); g.className = 'group';
    g.innerHTML = `<div class="pair"><img src="assets/${color}.png"><img src="assets/${color}.png"></div>
                   <div class="count ${p === pairs ? 'ask' : ''}">${p === pairs ? '❓' : p * 2}</div>`;
    groupsEl.appendChild(g); groups.push(g);
  }
  for (const g of groups) {                               // hero throws each pair
    hero.classList.remove('boing'); void hero.offsetWidth; hero.classList.add('boing');
    const imgs = g.querySelectorAll('img');
    throwGem(imgs[0]); await wait(120); await throwGem(imgs[1]);
    g.querySelector('.count').classList.add('show');
    await wait(250);
  }
  showChoices([answer, answer + 2, answer - 2].filter(n => n > 0));
  reveal = () => {
    groupsEl.lastChild.querySelector('.count').textContent = answer;
    groupsEl.lastChild.querySelector('.count').classList.remove('ask');
  };
  busy = false;
}

// ---- Reward: it rains golden medals, and one lands in our pile ----
const MEDALS = ['medal1', 'medal4', 'medal6', 'medal8'];
const pileEl = document.getElementById('pile');
function play(name) { if (!muted) { const a = new Audio('assets/' + name + '.mp3'); a.play().catch(() => {}); } }
function medalRain() {
  play('correct'); setTimeout(() => play('jingle'), 500);
  for (let i = 0; i < 22; i++) {
    const m = document.createElement('img');
    m.src = 'assets/' + MEDALS[i % MEDALS.length] + '.png'; m.className = 'rain';
    document.body.appendChild(m);
    const x = Math.random() * (innerWidth - 56), spin = (Math.random() * 2 - 1) * 540;
    m.animate([
      { transform: `translate(${x}px, -120px) rotate(0)` },
      { transform: `translate(${x + (Math.random() * 120 - 60)}px, ${innerHeight + 20}px) rotate(${spin}deg)` },
    ], { duration: 1400 + Math.random() * 900, delay: Math.random() * 700, easing: 'ease-in', fill: 'both' });
    setTimeout(() => m.remove(), 3100);
  }
  setTimeout(() => {
    const keep = document.createElement('img');
    keep.src = 'assets/' + MEDALS[pileEl.children.length % MEDALS.length] + '.png';
    pileEl.appendChild(keep); ting();
    document.getElementById('score').textContent = '🏅 ' + pileEl.children.length + ' of ' + WIN_AT;
  }, 1500);
}

// ---- How we win: collect 7 golden medals! ----
const WIN_AT = 7, winEl = document.getElementById('win');
let danceTimer, lastPet;
const ANIMALS = ['pig', 'panda', 'giraffe', 'monkey', 'penguin', 'rabbit', 'chick', 'elephant',
                 'frog', 'cow', 'hippo', 'owl', 'narwhal', 'duck'];
function youWin() {
  winEl.querySelector('.medals').innerHTML =
    Array.from({ length: WIN_AT }, (_, i) => `<img src="assets/${MEDALS[i % MEDALS.length]}.png" style="animation-delay:${i * .12}s">`).join('');
  // Prize: a giant random animal friend (never the same one twice in a row)
  let pet; do { pet = ANIMALS[Math.floor(Math.random() * ANIMALS.length)]; } while (pet === lastPet && ANIMALS.length > 1);
  lastPet = pet;
  const prize = winEl.querySelector('.prize');
  prize.src = 'assets/animal-' + pet + '.png';
  prize.style.animation = 'none'; void prize.offsetWidth; prize.style.animation = '';
  winEl.querySelector('.prizeName').textContent = 'You won a ' + pet.toUpperCase() + '!';
  winEl.classList.add('show'); document.getElementById('panel').style.visibility = 'hidden';
  play('you_win'); setTimeout(() => play('winjingle'), 900); setTimeout(() => play('congratulations'), 2600);
  medalRain2();
  danceTimer = setInterval(() => { hero.classList.remove('boing'); void hero.offsetWidth; hero.classList.add('boing'); medalRain2(); }, 1600);
}
function medalRain2() {                  // just the rain, no voice, no pile
  for (let i = 0; i < 14; i++) {
    const m = document.createElement('img');
    m.src = 'assets/' + MEDALS[i % MEDALS.length] + '.png'; m.className = 'rain'; m.style.zIndex = 10;
    document.body.appendChild(m);
    const x = Math.random() * (innerWidth - 56);
    m.animate([
      { transform: `translate(${x}px, -120px) rotate(0)` },
      { transform: `translate(${x + (Math.random() * 120 - 60)}px, ${innerHeight + 20}px) rotate(${(Math.random() * 2 - 1) * 540}deg)` },
    ], { duration: 1600 + Math.random() * 800, delay: Math.random() * 600, easing: 'ease-in', fill: 'both' });
    setTimeout(() => m.remove(), 3100);
  }
}
document.getElementById('again').onclick = () => {
  clearInterval(danceTimer);
  winEl.classList.remove('show'); document.getElementById('panel').style.visibility = '';
  pileEl.innerHTML = ''; rightAnswers = 0; setLevel(1);
  document.getElementById('score').textContent = '🏅 0 of ' + WIN_AT;
  newQuestion();
};

async function pick(btn, n) {
  if (busy) return;
  if (n === answer) {
    busy = true;
    reveal();
    msgEl.style.color = '#2f9a2e'; msgEl.textContent = '🎉 Yes! ' + answer + ' gems!';
    medalRain(); hero.classList.remove('boing'); void hero.offsetWidth; hero.classList.add('boing');
    rightAnswers++;
    await wait(2800);
    if (rightAnswers >= WIN_AT) { youWin(); return; }
    if (level === 1 && rightAnswers === 3) await levelUp();
    newQuestion();
  } else {
    btn.classList.remove('nope'); void btn.offsetWidth; btn.classList.add('nope');
    msgEl.style.color = '#e8413c'; msgEl.textContent = 'Try again! 🙂';
    silly();
  }
}

function layout() { drawWorld(); placeHero(); }
layout();
addEventListener('resize', layout);
setTimeout(newQuestion, 600);
</script>
